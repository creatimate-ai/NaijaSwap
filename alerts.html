<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alerts — NaijaSwap</title>
  <meta name="description" content="Stay updated on your Nigerian phone trade-in proposals, store approvals, and hub physical inspection slots.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080C0E">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    /* Alerts Page Custom Glassmorphic Styling */
    .header-icon-btn.is-active {
      color: var(--emerald-400);
      background: rgba(0, 210, 106, 0.08);
      border-color: rgba(0, 210, 106, 0.28);
      box-shadow: 0 0 16px rgba(0, 210, 106, 0.14), var(--glass-specular-soft);
    }
    .header-icon-btn.is-active:hover {
      color: #FFF;
      background: rgba(0, 210, 106, 0.15);
      border-color: rgba(0, 210, 106, 0.45);
    }

    .alerts-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .alerts-pills-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .alerts-pills-group::-webkit-scrollbar {
      display: none;
    }

    .alert-filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--spring-fast);
      box-shadow: var(--glass-specular-soft);
    }
    .alert-filter-pill:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-white);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .alert-filter-pill.active {
      background: linear-gradient(135deg, rgba(0, 210, 106, 0.18), rgba(0, 210, 106, 0.06));
      border-color: var(--emerald-border);
      color: #FFF;
      box-shadow: 0 4px 14px rgba(0, 210, 106, 0.15), var(--glass-specular);
    }
    .alert-filter-pill .count-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 0.74rem;
    }
    .alert-filter-pill.active .count-badge {
      background: var(--emerald-500);
      color: #05080B;
      font-weight: 800;
    }

    .alerts-action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-alert-ctrl {
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--spring-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-alert-ctrl:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFF;
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Stack of Notification Cards */
    .alerts-cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .alert-card-item {
      background: linear-gradient(135deg, rgba(16, 26, 37, 0.72), rgba(10, 16, 23, 0.65));
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--glass-shadow), var(--glass-specular-soft);
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: all var(--spring-fast);
      position: relative;
      cursor: pointer;
      text-decoration: none;
    }
    .alert-card-item:hover {
      border-color: var(--glass-border-hover);
      transform: translateY(-2px);
      background: linear-gradient(135deg, rgba(20, 32, 45, 0.8), rgba(12, 19, 28, 0.75));
    }

    .alert-card-item.is-unread {
      border-color: rgba(0, 210, 106, 0.35);
      background: linear-gradient(135deg, rgba(0, 210, 106, 0.08), rgba(16, 26, 37, 0.85));
    }
    .alert-card-item.is-unread::before {
      content: '';
      position: absolute;
      left: 0;
      top: 18px;
      bottom: 18px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--emerald-400);
      box-shadow: 0 0 10px var(--emerald-400);
    }

    .alert-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--glass-specular-soft);
    }
    .alert-icon-wrap.tint-emerald {
      background: rgba(0, 210, 106, 0.12);
      border: 1px solid var(--emerald-border);
      color: var(--emerald-400);
    }
    .alert-icon-wrap.tint-amber {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--amber-border);
      color: var(--amber-400);
    }
    .alert-icon-wrap.tint-rose {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid var(--rose-border);
      color: var(--rose-400);
    }
    .alert-icon-wrap.tint-cyan {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid var(--cyan-border);
      color: var(--cyan-400);
    }

    .alert-content-wrap {
      flex: 1;
      min-width: 0;
    }
    .alert-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .alert-card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #FFF;
    }
    .alert-time-text {
      font-size: 0.74rem;
      color: var(--text-faint);
      white-space: nowrap;
    }
    .alert-message-text {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .alert-dismiss-btn {
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color var(--spring-fast);
      align-self: flex-start;
    }
    .alert-dismiss-btn:hover {
      color: var(--rose-400);
    }
  </style>
</head>
<body>

  <!-- Scripts -->
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { NaijaSwapData } from './js/dashboard-data.js';
    import { db, collection, auth } from './js/firebase-config.js';
    import { setButtonLoading } from './js/auth.js';
    import {
      onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, limit
    } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

    let currentUserId = 'user_guest';
    let currentUserName = 'Swapper';
    let currentFilter = 'all';
    let userReady = false;
    let unsubscribeSnapshot = null;
    let liveNotifications = [];

    // DOM Elements
    const alertsContainer = document.getElementById('alertsContainer');
    const countAllAlerts = document.getElementById('countAllAlerts');
    const countUnreadAlerts = document.getElementById('countUnreadAlerts');
    const countSwapAlerts = document.getElementById('countSwapAlerts');
    const markAllReadBtn = document.getElementById('markAllReadBtn');
    const clearAllAlertsBtn = document.getElementById('clearAllAlertsBtn');
    const notifDot = document.getElementById('notifDot');
    const mobileAlertsBadge = document.getElementById('mobileAlertsBadge');
    const mobileSwapsBadge = document.getElementById('mobileSwapsBadge');

    const userMenuBtn = document.getElementById('userMenuBtn');
    const userDropdown = document.getElementById('userDropdown');

    // Initialize session user from synchronous local cache
    try {
      const stored = localStorage.getItem('naijaswap_user') || localStorage.getItem('naijaswap_user');
      if (stored) {
        const u = JSON.parse(stored);
        currentUserId = u.uid || 'user_guest';
        currentUserName = u.displayName || (u.email ? u.email.split('@')[0] : 'Swapper');
      }
    } catch (e) {}

    // Update Header User UI
    function updateHeaderUserUI(name, uid, photoURL) {
      const headerUserName = document.getElementById('headerUserName');
      const headerAvatarFallback = document.getElementById('headerAvatarFallback');
      if (headerUserName) headerUserName.textContent = name;
      if (headerAvatarFallback) {
        const storedPhoto = uid ? localStorage.getItem('naijaswap_photo_' + uid) : null;
        const photo = storedPhoto || (photoURL && photoURL.startsWith('http') ? photoURL : null);
        if (photo) {
          headerAvatarFallback.innerHTML = `<img src="${photo}" alt="${escapeHtml(name)}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
        } else {
          headerAvatarFallback.textContent = name.charAt(0).toUpperCase();
        }
      }
    }

    updateHeaderUserUI(currentUserName, currentUserId);

    // --- Real-time Firestore listener ---
    function startRealtimeListener(uid) {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      const notifRef = collection(db, 'users', uid, 'notifications');
      const q = query(notifRef, orderBy('createdAt', 'desc'), limit(100));
      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        liveNotifications = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAlerts();
      }, (err) => {
        console.warn('[Alerts] Snapshot error:', err.message);
        renderAlerts();
      });
    }

    // Mark a single notification as read in Firestore
    async function markReadInFirestore(uid, notifId) {
      try {
        await updateDoc(doc(db, 'users', uid, 'notifications', notifId), { isRead: true });
      } catch (e) { console.warn('[Alerts] markRead error:', e.message); }
    }

    // Mark all notifications as read in Firestore
    async function markAllReadInFirestore(uid) {
      const unread = liveNotifications.filter(n => !n.isRead);
      await Promise.all(unread.map(n => markReadInFirestore(uid, n.id)));
    }

    // Delete a notification from Firestore
    async function deleteInFirestore(uid, notifId) {
      try {
        await deleteDoc(doc(db, 'users', uid, 'notifications', notifId));
      } catch (e) { console.warn('[Alerts] delete error:', e.message); }
    }

    // Hook from auth.js when Firebase user is confirmed/ready
    window.onNaijaSwapUserReady = (user, role) => {
      if (user) {
        userReady = true;
        currentUserId = user.uid;
        currentUserName = user.displayName || (user.email ? user.email.split('@')[0] : 'Swapper');

        updateHeaderUserUI(currentUserName, user.uid, user.photoURL);

        // Start real-time listener — replaces old renderAlerts() call
        startRealtimeListener(user.uid);
      }
    };

    // Notification type config
    function getNotifStyle(type) {
      const t = String(type || '');
      if (t.includes('accepted') || t.includes('passed') || t.includes('approved') || t === 'verification_approved') {
        return { tint: 'tint-emerald', icon: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' };
      }
      if (t.includes('rejected') || t.includes('cancelled') || t.includes('failed') || t.includes('dispute')) {
        return { tint: 'tint-rose', icon: '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' };
      }
      if (t.includes('pending') || t.includes('payment') || t.includes('countered')) {
        return { tint: 'tint-amber', icon: '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>' };
      }
      if (t.includes('handover') || t.includes('inspection') || t.includes('completed')) {
        return { tint: 'tint-cyan', icon: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>' };
      }
      return { tint: 'tint-emerald', icon: '<path d="M7 16L3 12M3 12L7 8M3 12L17 12"/><path d="M17 8L21 12M21 12L17 16M21 12L7 12"/>' };
    }

    // Render Notifications
    function renderAlerts() {
      const allNotifs = liveNotifications;
      const unreadCount = allNotifs.filter(n => !n.isRead).length;
      const swapCount = allNotifs.filter(n => (n.type || '').includes('swap')).length;

      // Update counters
      if (countAllAlerts) countAllAlerts.textContent = allNotifs.length;
      if (countUnreadAlerts) countUnreadAlerts.textContent = unreadCount;
      if (countSwapAlerts) countSwapAlerts.textContent = swapCount;

      // Header dot & mobile bottom nav badge
      if (notifDot) notifDot.style.display = unreadCount > 0 ? 'block' : 'none';
      if (mobileAlertsBadge) {
        if (unreadCount > 0) {
          mobileAlertsBadge.textContent = unreadCount;
          mobileAlertsBadge.style.display = 'inline-block';
        } else {
          mobileAlertsBadge.style.display = 'none';
        }
      }

      // Also update swaps badge in bottom nav
      const mySwaps = NaijaSwapData.getUserSwapRequests(currentUserId);
      if (mobileSwapsBadge) {
        if (mySwaps.length > 0) {
          mobileSwapsBadge.textContent = mySwaps.length;
          mobileSwapsBadge.style.display = 'inline-block';
        } else {
          mobileSwapsBadge.style.display = 'none';
        }
      }

      // Filter
      let list = allNotifs;
      if (currentFilter === 'unread') list = allNotifs.filter(n => !n.isRead);
      else if (currentFilter === 'swaps') list = allNotifs.filter(n => (n.type || '').includes('swap'));

      // Empty state
      if (allNotifs.length === 0) {
        alertsContainer.innerHTML = `
          <div class="empty-state-box" id="emptyAlertsState">
            <div class="empty-state-icon">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--emerald-400)" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
            </div>
            <h3 class="empty-state-title">No alerts yet</h3>
            <p class="empty-state-desc">
              You don't have any notifications right now. When you submit swap requests, receive store approvals, or get hub inspection updates, they will appear here.
            </p>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
              <a href="dashboard.html" class="btn-primary-action" style="text-decoration: none; padding: 12px 22px; display: inline-flex; align-items: center; gap: 8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>Browse Phones</span>
              </a>
              <a href="my-swaps.html?action=new" class="btn-reset-filters" style="text-decoration: none; padding: 12px 22px; font-weight: 700; color: #FFF; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: 8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 16L3 12M3 12L7 8M3 12L17 12"/><path d="M17 8L21 12M21 12L17 16M21 12L7 12"/></svg>
                <span>Propose a Swap</span>
              </a>
            </div>
          </div>
        `;
        return;
      }

      if (list.length === 0) {
        alertsContainer.innerHTML = `
          <div class="empty-state-box">
            <h3 class="empty-state-title" style="font-size: 1.1rem;">No ${currentFilter} notifications</h3>
            <p class="empty-state-desc">You're completely caught up in this category.</p>
          </div>
        `;
        return;
      }

      // Render cards
      let html = '<div class="alerts-cards-stack fade-in-content">';
      list.forEach(notif => {
        const { tint, icon } = getNotifStyle(notif.type);
        const ts = notif.createdAt;
        let timeStr = '';
        try {
          const d = ts?.toDate ? ts.toDate() : new Date(ts || 0);
          const diff = (Date.now() - d.getTime()) / 1000;
          if (diff < 60) timeStr = 'Just now';
          else if (diff < 3600) timeStr = `${Math.floor(diff / 60)}m ago`;
          else if (diff < 86400) timeStr = `${Math.floor(diff / 3600)}h ago`;
          else timeStr = d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short' });
        } catch (e) { timeStr = ''; }
        const unreadClass = notif.isRead ? '' : 'is-unread';
        const link = notif.requestId ? `my-swaps.html?requestId=${notif.requestId}` : (notif.link || 'my-swaps.html');

        html += `
          <div class="alert-card-item ${unreadClass}" data-id="${escapeHtml(notif.id)}" data-link="${escapeHtml(link)}">
            <div class="alert-icon-wrap ${tint}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                ${icon}
              </svg>
            </div>
            <div class="alert-content-wrap">
              <div class="alert-title-row">
                <span class="alert-card-title">${escapeHtml(notif.title || 'Notification')}</span>
                <span class="alert-time-text">${escapeHtml(timeStr)}</span>
              </div>
              <p class="alert-message-text">${escapeHtml(notif.message || '')}</p>
            </div>
            <button type="button" class="alert-dismiss-btn" data-id="${escapeHtml(notif.id)}" title="Dismiss notification" aria-label="Dismiss">&times;</button>
          </div>
        `;
      });
      html += '</div>';

      alertsContainer.innerHTML = html;

      // Bind click on cards
      document.querySelectorAll('.alert-card-item').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.alert-dismiss-btn')) return;
          const id = card.dataset.id;
          const link = card.dataset.link;
          if (id && currentUserId !== 'user_guest') markReadInFirestore(currentUserId, id);
          if (link) window.location.href = link;
        });
      });

      // Bind dismiss
      document.querySelectorAll('.alert-dismiss-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (id && currentUserId !== 'user_guest') deleteInFirestore(currentUserId, id);
          // onSnapshot will auto-re-render after deletion
        });
      });

    }

    // Filter Listeners
    document.querySelectorAll('.alert-filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.alert-filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        renderAlerts();
      });
    });

    // Mark all as read
    if (markAllReadBtn) {
      markAllReadBtn.addEventListener('click', async (e) => {
        setButtonLoading(e.currentTarget, true, 'Updating...');
        try {
          if (currentUserId !== 'user_guest') await markAllReadInFirestore(currentUserId);
        } finally {
          setButtonLoading(e.currentTarget, false);
        }
      });
    }

    // Clear all
    if (clearAllAlertsBtn) {
      clearAllAlertsBtn.addEventListener('click', async (e) => {
        if (!confirm('Clear all notifications?')) return;
        setButtonLoading(e.currentTarget, true, 'Clearing...');
        try {
          if (currentUserId !== 'user_guest') {
            await Promise.all(liveNotifications.map(n => deleteInFirestore(currentUserId, n.id)));
          }
        } finally {
          setButtonLoading(e.currentTarget, false);
        }
      });
    }

    // Dropdown
    if (userMenuBtn && userDropdown) {
      userMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('active');
      });
      document.addEventListener('click', () => userDropdown.classList.remove('active'));
    }

    // Auth readiness triggers the first data render.

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
