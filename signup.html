<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — NaijaSwap</title>
  <meta name="description" content="Create a NaijaSwap account to discover matching smartphone swap offers across Nigeria.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Ambient Glows -->
  <div class="auth-bg-glow auth-glow-1"></div>
  <div class="auth-bg-glow auth-glow-2"></div>

  <!-- Header -->
  <header class="auth-header">
    <a href="index.html" class="brand-logo">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M7 16L3 12M3 12L7 8M3 12L17 12"/>
          <path d="M17 8L21 12M21 12L17 16M21 12L7 12"/>
        </svg>
      </div>
      <span class="brand-name">Niger<span>Swap</span></span>
    </a>
    <a href="index.html" class="header-back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to Home</span>
    </a>
  </header>

  <!-- Main Content -->
  <main class="auth-main-container">
    <div class="auth-card">
      <div class="auth-card-glow"></div>

      <div class="auth-title-row">
        <div class="auth-badge" id="authRoleBadge">Swapper Account</div>
        <h1 class="auth-title" id="authTitle">Create your account</h1>
        <p class="auth-subtitle" id="authSubtitle">Join thousands of Nigerians swapping phones safely</p>
      </div>

      <!-- Account Type Selection Tabs -->
      <div class="role-selector-container">
        <div class="role-selector" id="roleSelector" role="tablist" aria-label="Account Type Selection">
          <button type="button" class="role-btn active" data-role="customer" id="roleBtnCustomer" role="tab" aria-selected="true">
            <span class="role-icon">🔄</span>
            <div class="role-text-wrap">
              <span class="role-name">Swapper</span>
              <span class="role-tagline">I want to exchange my phone</span>
            </div>
            <span class="role-check-indicator"></span>
          </button>
          <button type="button" class="role-btn" data-role="dealer" id="roleBtnDealer" role="tab" aria-selected="false">
            <span class="role-icon">🏬</span>
            <div class="role-text-wrap">
              <span class="role-name">Store / Dealer</span>
              <span class="role-tagline">I offer phones for swapping</span>
            </div>
            <span class="role-check-indicator"></span>
          </button>
        </div>
      </div>

      <!-- Alert Notification Banner -->
      <div class="auth-alert" id="signupAlert" role="alert"></div>

      <!-- Google Sign In Button -->
      <button type="button" class="btn-google" id="googleSignUpBtn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span id="googleBtnText">Continue with Google as Swap Hunter</span>
      </button>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="divider-text">or sign up with email</span>
      </div>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signupForm" novalidate>
        <input type="hidden" id="selectedRoleInput" name="role" value="customer">

        <div class="form-field dealer-only-field" id="dealerShopField" style="display: none;">
          <label class="form-label" for="signupShopName">Shop or Business Name</label>
          <input type="text" id="signupShopName" class="auth-input" placeholder="e.g. Your Store Name, Computer Village">
        </div>

        <div class="form-field">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" class="auth-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-field">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="input-wrapper">
            <input type="password" id="signupPassword" class="auth-input" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="form-field">
          <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="signupConfirmPassword" class="auth-input" placeholder="Re-enter your password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-primary" id="signupSubmitBtn">
          <span>Create account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <!-- Log In Footer Switch -->
      <div class="auth-footer-switch">
        <span>Already have an account?</span>
        <a href="login.html" class="switch-link">Log in</a>
      </div>
    </div>
  </main>

  <!-- Authentication Controller Script -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
