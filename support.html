<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Support & Help Desk — NaijaSwap Nigeria</title>
  <meta name="description" content="Contact NaijaSwap 24/7 customer support, get swap dispute assistance, hub appointment guidance, and device verification help.">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#080C0E">
  <link rel="canonical" href="https://naijaswap.web.app/support.html">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="site.webmanifest">

  <!-- Open Graph Protocol -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NaijaSwap">
  <meta property="og:title" content="Support & Help Desk — NaijaSwap Nigeria">
  <meta property="og:description" content="Contact NaijaSwap 24/7 customer support, get swap dispute assistance, hub appointment guidance, and device verification help.">
  <meta property="og:url" content="https://naijaswap.web.app/support.html">
  <meta property="og:image" content="https://naijaswap.web.app/assets/og-banner.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_NG">

  <!-- Twitter Card Protocol -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Support & Help Desk — NaijaSwap Nigeria">
  <meta name="twitter:description" content="Contact NaijaSwap 24/7 customer support, get swap dispute assistance, hub appointment guidance, and device verification help.">
  <meta name="twitter:image" content="https://naijaswap.web.app/assets/og-banner.svg">

  <!-- Structured Data: ContactPage & BreadcrumbList Schemas -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ContactPage",
        "@id": "https://naijaswap.web.app/support.html#contact",
        "url": "https://naijaswap.web.app/support.html",
        "name": "NaijaSwap Customer Support & Help Desk",
        "description": "24/7 customer support and swap dispute resolution for Nigerian phone swappers and dealers."
      },
      {
        "@type": "BreadcrumbList",
        "@id": "https://naijaswap.web.app/support.html#breadcrumb",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://naijaswap.web.app/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Support",
            "item": "https://naijaswap.web.app/support.html"
          }
        ]
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Ambient Glows (Depth for Frosted Glass) -->
  <div class="dash-glow dash-glow-1" aria-hidden="true"></div>
  <div class="dash-glow dash-glow-2" aria-hidden="true"></div>

  <!-- Main Container -->
  <main class="support-page-container">

    <!-- Top Navigation Header -->
    <header class="more-header">
      <a href="more.html" onclick="if (window.history.length > 1 && document.referrer) { window.history.back(); return false; }" class="more-back-btn" aria-label="Back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Back</span>
      </a>

      <div class="more-brand-pill">
        <div class="logo-mark-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M7 16L3 12M3 12L7 8M3 12L17 12"/>
            <path d="M17 8L21 12M21 12L17 16M21 12L7 12"/>
          </svg>
        </div>
        <span>NaijaSwap</span>
      </div>
    </header>

    <!-- Page Title Section -->
    <section class="more-title-section">
      <h1 class="more-title">Support</h1>
      <p class="more-subtitle">We're here to assist with your phone swaps, hub inspections, and account needs</p>
    </section>



    <!-- ======================================================================
         FORMSPREE TICKET SUBMISSION FORM
         ====================================================================== -->
    <section class="support-form-card" aria-label="Submit Support Ticket">
      <div class="support-form-header">
        <span class="tag-badge tag-verified">Priority Support Desk</span>
        <h2 class="support-form-title" style="margin-top: 6px;">Submit a Ticket</h2>
        <p class="support-form-sub">Send us your issue or question. We will review your case and reply directly to your email.</p>
      </div>

      <!-- Real-time Alert Banner -->
      <div id="supportFormAlert" class="auth-alert" role="alert"></div>

      <!-- Formspree Connected Form -->
      <form id="supportTicketForm" action="https://formspree.io/f/xjyvlewg" method="POST" novalidate>
        
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="ticketName">Full Name</label>
          <input 
            type="text" 
            id="ticketName" 
            name="name" 
            class="dash-input" 
            placeholder="Your full name" 
            required 
            autocomplete="name"
          >
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label class="form-label" for="ticketEmail">Email Address</label>
          <input 
            type="email" 
            id="ticketEmail" 
            name="email" 
            class="dash-input" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label class="form-label" for="ticketPhone">Phone Number <span style="font-weight: 400; color: var(--text-faint);">(Optional)</span></label>
          <input 
            type="tel" 
            id="ticketPhone" 
            name="phone" 
            class="dash-input" 
            placeholder="e.g. +234 801 234 5678" 
            autocomplete="tel"
          >
        </div>

        <!-- Topic / Category -->
        <div class="form-group">
          <label class="form-label" for="ticketCategory">Topic / Category</label>
          <select id="ticketCategory" name="category" class="support-select" required>
            <option value="Swap Valuation & Top-up Dispute">Swap Valuation & Top-up Dispute</option>
            <option value="Hub Inspection & Testing Issue">Hub Inspection & Testing Issue</option>
            <option value="Account & Security Inquiry">Account & Security Inquiry</option>
            <option value="Store Partnership & Verification">Store Partnership & Verification</option>
            <option value="Safe Deal Protocol & Fraud Report">Safe Deal Protocol & Fraud Report</option>
            <option value="General Question or Feedback" selected>General Question or Feedback</option>
          </select>
        </div>

        <!-- Message -->
        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="ticketMessage">Detailed Message</label>
          <textarea 
            id="ticketMessage" 
            name="message" 
            class="support-textarea" 
            placeholder="Please describe your issue, swap reference, or device model..." 
            required
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary-action" id="submitTicketBtn" style="width: 100%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span>Send Ticket to Support</span>
        </button>

      </form>
    </section>

  </main>

  <!-- ==========================================================================
       FORMSPREE INTEGRATION & AUTO-FILL CONTROLLER
       ========================================================================== -->
  <script type="module">
    import { auth, onAuthStateChanged } from './js/firebase-config.js';
    import { showAuthAlert, clearAuthAlert, setButtonLoading } from './js/auth.js';

    const form = document.getElementById('supportTicketForm');
    const submitBtn = document.getElementById('submitTicketBtn');
    const inputName = document.getElementById('ticketName');
    const inputEmail = document.getElementById('ticketEmail');
    const inputPhone = document.getElementById('ticketPhone');
    const inputCategory = document.getElementById('ticketCategory');
    const inputMessage = document.getElementById('ticketMessage');

    // Auto-fill form fields if user is authenticated
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.displayName && !inputName.value) {
          inputName.value = user.displayName;
        }
        if (user.email && !inputEmail.value) {
          inputEmail.value = user.email;
        }
        const storedPhone = localStorage.getItem('naijaswap_phone_' + user.uid);
        const phoneVal = user.phoneNumber || storedPhone || '';
        if (phoneVal && !inputPhone.value) {
          inputPhone.value = phoneVal;
        }
      }
    });

    // Formspree AJAX Submission Handler
    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAuthAlert('supportFormAlert');

      const name = inputName.value.trim();
      const email = inputEmail.value.trim();
      const message = inputMessage.value.trim();
      const category = inputCategory.value;
      const phone = inputPhone.value.trim();

      // Client-side validation
      if (!name) {
        showAuthAlert('supportFormAlert', 'Please enter your full name.');
        inputName.focus();
        return;
      }
      if (!email || !email.includes('@')) {
        showAuthAlert('supportFormAlert', 'Please enter a valid email address.');
        inputEmail.focus();
        return;
      }
      if (!message || message.length < 10) {
        showAuthAlert('supportFormAlert', 'Please provide a detailed message (at least 10 characters).');
        inputMessage.focus();
        return;
      }

      try {
        setButtonLoading(submitBtn, true, 'Sending ticket...');

        const formData = new FormData();
        formData.append('name', name);
        formData.append('email', email);
        formData.append('phone', phone || 'Not provided');
        formData.append('category', category);
        formData.append('message', message);
        formData.append('_subject', `[NaijaSwap Support] ${category} - ${name}`);

        const response = await fetch('https://formspree.io/f/xjyvlewg', {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        });

        setButtonLoading(submitBtn, false);

        if (response.ok) {
          showAuthAlert(
            'supportFormAlert',
            `Thank you, ${name}! Your ticket has been received by our support team. We will review your request and reply to ${email} shortly.`,
            'success'
          );
          // Reset fields but keep user identity if logged in
          inputMessage.value = '';
          if (!auth.currentUser) {
            inputName.value = '';
            inputEmail.value = '';
            inputPhone.value = '';
          }
        } else {
          const data = await response.json().catch(() => ({}));
          const errorMsg = data?.errors?.map(err => err.message).join(', ') || 'Failed to send ticket. Please check your details and try again.';
          showAuthAlert('supportFormAlert', errorMsg);
        }
      } catch (err) {
        setButtonLoading(submitBtn, false);
        showAuthAlert('supportFormAlert', 'Network connection issue. Please check your internet connection or email us directly at support@naijaswap.ng');
      }
    });
  </script>

</body>
</html>
