<!DOCTYPE html>

  <!-- Main Container -->

    <section class="more-user-card" id="moreUserCard" aria-label="Account Overview">

          U

          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>

    </section>

    <!-- Navigation Menu Options (Dynamically Adapted) -->
    <nav class="more-menu-list" id="moreMenuList" aria-label="Menu Options">
      <!-- Injected by JavaScript based on Swapper vs Dealer role -->
    </nav>

  </main>

  <!-- Dynamic Mobile Bottom Navigation Container -->
  <div id="bottomNavContainer">
    <!-- Injected dynamically with Swapper or Dealer tabs -->
  </div>

  <script type="module">
    import { auth, onAuthStateChanged } from './js/firebase-config.js';
    import { getStoredProfile, getStoredRole, isProfileComplete, getStoreMetrics, resolveMedia } from './js/profile.js';
    import { getUserRole } from './js/auth.js';

    // Elements
    const moreBackBtn = document.getElementById('moreBackBtn');
    const moreBackBtnText = document.getElementById('moreBackBtnText');
    const brandPillTitle = document.getElementById('brandPillTitle');
    const topRoleTag = document.getElementById('topRoleTag');
    const moreMainTitle = document.getElementById('moreMainTitle');
    const moreMainSubtitle = document.getElementById('moreMainSubtitle');
    const moreUserName = document.getElementById('moreUserName');
    const moreUserEmail = document.getElementById('moreUserEmail');
    const moreAvatarNode = document.getElementById('moreAvatarNode');
    const moreStatusBadge = document.getElementById('moreStatusBadge');
    const moreUserCtaBtn = document.getElementById('moreUserCtaBtn');
    const moreMenuList = document.getElementById('moreMenuList');
    const bottomNavContainer = document.getElementById('bottomNavContainer');

    // Determine initial role from stored authentication state (URL overrides prohibited)
    function resolveInitialRole() {
      try {
        const lastUid = localStorage.getItem('naijaswap_last_uid');
        if (lastUid) {
          const direct = localStorage.getItem('naijaswap_role_' + lastUid);
          if (direct) return direct.toLowerCase();
        }
        const lastRole = localStorage.getItem('naijaswap_last_role');
        if (lastRole) return lastRole.toLowerCase();
      } catch (_) {}
      return 'customer';
    }

    let currentRole = resolveInitialRole();

    function renderMorePage(role, user = null) {
      currentRole = role;
      const isDealer = role === 'dealer';
      const uid = user?.uid || localStorage.getItem('naijaswap_last_uid') || '';
      const profile = uid ? getStoredProfile(uid) : {};

      // 1. Back button & Headers
      if (isDealer) {
        moreBackBtn.href = 'dealer-dashboard.html';
        moreBackBtnText.textContent = 'Store Hub';
        brandPillTitle.innerHTML = 'NaijaSwap <strong>Store</strong>';
        
        moreMainTitle.textContent = 'Store Hub & Settings';
        moreMainSubtitle.textContent = 'Manage phone inventory, incoming swap requests, business verification, and settlement.';
        
        // User Banner
        const shopName = profile.businessName || (uid ? localStorage.getItem('naijaswap_shop_' + uid) : '') || user?.displayName || 'My Gadget Hub';
        moreUserName.textContent = shopName;
        moreUserEmail.textContent = user?.email || profile.businessEmail || 'Store Partner Account';
        
        const isVerified = isProfileComplete(user, 'dealer');
        moreStatusBadge.className = isVerified ? 'more-badge-pill badge-cyan' : 'more-badge-pill badge-amber';
        moreStatusBadge.textContent = isVerified ? 'KYC Verified' : 'KYC Pending';

        const photo = (uid ? localStorage.getItem('naijaswap_photo_' + uid) : null) || profile.avatar || profile.photoURL || user?.photoURL;
        if (photo) {
          resolveMedia(photo).then(src => {
            if (src && moreAvatarNode) {
              moreAvatarNode.innerHTML = `<img src="${src}" alt="${shopName}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
          });
        } else {
          moreAvatarNode.style.background = 'linear-gradient(135deg, var(--cyan-400), var(--emerald-400))';
          moreAvatarNode.textContent = shopName.charAt(0).toUpperCase() || 'S';
        }

        moreUserCtaBtn.className = 'more-user-cta-btn more-user-cta-dealer';
        moreUserCtaBtn.href = 'account.html';
        moreUserCtaBtn.innerHTML = '<span>Store Profile</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>';

        renderDealerMenu(profile);
        renderDealerBottomNav();

      } else {
        // Swapper Mode
        moreBackBtn.href = 'dashboard.html';
        moreBackBtnText.textContent = 'Back';
        brandPillTitle.textContent = 'NaijaSwap';

        moreMainTitle.textContent = 'More';
        moreMainSubtitle.textContent = 'App preferences, swap history, support channels, and legal policies.';

        const name = user?.displayName || (user?.email ? user.email.split('@')[0] : 'Swapper');
        moreUserName.textContent = name;
        moreUserEmail.textContent = user?.email || 'Verified Consumer';

        moreStatusBadge.className = 'more-badge-pill badge-emerald';
        moreStatusBadge.textContent = 'Active Swapper';

        const swapperPhoto = (uid ? localStorage.getItem('naijaswap_photo_' + uid) : null) || profile.avatar || profile.photoURL || user?.photoURL;
        if (swapperPhoto) {
          resolveMedia(swapperPhoto).then(src => {
            if (src && moreAvatarNode) {
              moreAvatarNode.innerHTML = `<img src="${src}" alt="${name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
          });
        } else {
          moreAvatarNode.style.background = 'linear-gradient(135deg, var(--emerald-400), var(--cyan-400))';
          moreAvatarNode.textContent = name.charAt(0).toUpperCase() || 'U';
        }

        moreUserCtaBtn.className = 'more-user-cta-btn more-user-cta-swapper';
        moreUserCtaBtn.href = 'account.html';
        moreUserCtaBtn.innerHTML = '<span>My Profile</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>';

        renderSwapperMenu();
        renderSwapperBottomNav();
      }
    }

        <!-- 9. Privacy Policy -->

            <div class="more-item-texts">

      `;
    }

    function renderSwapperBottomNav() {
      let swapCount = 0;
      try {
        const stored = JSON.parse(localStorage.getItem('naijaswap_swap_requests') || '[]');
        if (Array.isArray(stored)) swapCount = stored.length;
      } catch (_) {}

      bottomNavContainer.innerHTML = `
        <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
          <a href="dashboard.html" class="bottom-nav-item" id="navHomeBtn" title="Browse Phones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Home</span>
          </a>
          <a href="my-swaps.html" class="bottom-nav-item" id="navMySwapsBtn" title="My Swaps">
            ${swapCount > 0 ? `<span class="bottom-nav-badge" style="display: inline-block;">${swapCount}</span>` : ''}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 16L3 12M3 12L7 8M3 12L17 12"></path><path d="M17 8L21 12M21 12L17 16M21 12L7 12"></path></svg>
            <span>My Swaps</span>
          </a>
          <a href="alerts.html" class="bottom-nav-item" id="navNotifBtn" title="Alerts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>Alerts</span>
          </a>
          <a href="more.html" class="bottom-nav-item active" id="navMoreBtn" title="More" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            <span>More</span>
          </a>
        </nav>
      `;
    }

    // Initial immediate render
    renderMorePage(currentRole);

    // Dynamic Auth listener to refine data
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const detectedRole = await getUserRole(user);
        renderMorePage(detectedRole, user);
      } else {
        renderMorePage(currentRole, null);
      }
    });

    // Native iOS-style tactile feedback on menu click
    document.addEventListener('click', (e) => {
      const item = e.target.closest('.more-menu-item');
      if (item && navigator.vibrate) {
        try { navigator.vibrate(10); } catch (_) {}
      }
    });
  </script>
</body>
</html>
